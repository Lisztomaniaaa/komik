# LiteLLM bridge: exposes an Anthropic-compatible /v1/messages endpoint
# backed by the Pareto Inference OpenAI-compatible router.
#
# Claude Code speaks the Anthropic Messages API; api.paretoinference.com only
# speaks /v1/chat/completions, so this proxy sits between the two.
#
# The `hosted_vllm/` prefix (not `openai/`) is deliberate: LiteLLM routes the
# `openai` provider's /v1/messages traffic through the OpenAI Responses API,
# which this router does not implement. `hosted_vllm` is an OpenAI-compatible
# chat/completions provider, which is what the router actually serves.

model_list:
  # Main model
  - model_name: glm-5.3
    litellm_params:
      model: hosted_vllm/z-ai/glm-5.3
      api_base: os.environ/PARETO_BASE_URL
      api_key: os.environ/PARETO_API_KEY

  # Cheap/fast model (Claude Code background tasks, titles, summaries)
  - model_name: glm-5.3-flash
    litellm_params:
      model: hosted_vllm/z-ai/glm-5.3-flash
      api_base: os.environ/PARETO_BASE_URL
      api_key: os.environ/PARETO_API_KEY

  - model_name: deepseek-v4-flash
    litellm_params:
      model: hosted_vllm/deepseek/deepseek-v4-flash
      api_base: os.environ/PARETO_BASE_URL
      api_key: os.environ/PARETO_API_KEY

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
